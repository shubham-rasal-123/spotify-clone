<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spotify-inspired music player interface built with HTML, CSS, and JavaScript.">
    <link rel="icon" href="images/logo.png" type="image/png">
    <title>Spotify Clone - Your favourite music is here</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav aria-label="Primary navigation">
        <ul>
            <li class="brand">
                <img src="images/logo.png" alt="">
                <span class="brand-name">Spotify Clone</span>
            </li>
            <li class="home">Home</li>
            <li class="about">About</li>
            <li class="new">New Release</li>
            <li class="old">Old Songs</li>
        </ul>
    </nav>

    <main class="container">
        <section class="songList" aria-labelledby="playlistTitle">
            <h1 id="playlistTitle">Best of NCS - No Copyright Sounds</h1>
            <div class="songItemContainer">
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">05:34 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">03:50 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">04:44 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">03:26 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">02:50 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">06:12 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">04:18 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">05:27 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">06:00 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
                <div class="songItem">
                    <img alt="">
                    <span class="songName"></span>
                    <span class="timestamp">05:00 <button type="button" class="songItemPlay"
                            aria-label="Play song">▶</button></span>
                </div>
            </div>
        </section>
        <div class="songBanner" aria-hidden="true"></div>
    </main>

    <audio id="audioElement" preload="metadata"></audio>

    <footer class="bottom">
        <label class="progress-label" for="myProgressBar">Progress
            <input type="range" id="myProgressBar" min="0" max="100" value="0" aria-label="Playback progress">
        </label>
        <div class="icons" aria-label="Playback controls">
            <button type="button" class="control-btn" id="previous" aria-label="Previous song">⏮</button>
            <button type="button" class="control-btn main-control" id="masterPlay" aria-label="Play song">▶</button>
            <button type="button" class="control-btn" id="next" aria-label="Next song">⏭</button>
        </div>
        <div class="songInfo" aria-live="polite">
            <img src="images/playing.gif" width="42" alt="" id="gif">
            <span id="masterSongName">Warriyo - Mortals [NCS Release]</span>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
